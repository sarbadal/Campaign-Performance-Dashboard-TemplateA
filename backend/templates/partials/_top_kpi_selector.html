<section class="panel top-kpi-panel" aria-label="Select KPI">
  <div class="top-kpi-row">
    <form method="get" action="{{ url_for('dashboard.dashboard') }}#insights-top" class="top-kpi-form">
      <input type="hidden" name="date_from" value="{{ filters.date_from }}">
      <input type="hidden" name="date_to" value="{{ filters.date_to }}">
      {% for field in active_filter_fields %}
        {% for item in filters[field.key] %}
        <input type="hidden" name="{{ field.key }}" value="{{ item }}">
        {% endfor %}
      {% endfor %}
      <input type="hidden" name="line_kpi_left" value="{{ selected_line_kpi_left }}">
      <input type="hidden" name="line_kpi_right" value="{{ selected_line_kpi_right }}">
      <input type="hidden" name="line_granularity" value="{{ selected_line_granularity }}">
      <input type="hidden" name="top_kpi_platform" value="{{ selected_top_kpi_platform }}">

      <label class="filter-field top-kpi-field">
        <span class="filter-label">Top Adset KPI</span>
        <div class="top-kpi-control-row">
          <select name="top_kpi_adset" aria-label="Select KPI for top adset chart">
            {% for key, label in top_kpi_options.items() %}
            <option value="{{ key }}" {% if key == selected_top_kpi_adset %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
          <button type="submit" class="btn-apply">Apply Adset KPI</button>
        </div>
      </label>
    </form>

    <form method="get" action="{{ url_for('dashboard.dashboard') }}#insights-top" class="top-kpi-form">
      <input type="hidden" name="date_from" value="{{ filters.date_from }}">
      <input type="hidden" name="date_to" value="{{ filters.date_to }}">
      {% for field in active_filter_fields %}
        {% for item in filters[field.key] %}
        <input type="hidden" name="{{ field.key }}" value="{{ item }}">
        {% endfor %}
      {% endfor %}
      <input type="hidden" name="line_kpi_left" value="{{ selected_line_kpi_left }}">
      <input type="hidden" name="line_kpi_right" value="{{ selected_line_kpi_right }}">
      <input type="hidden" name="line_granularity" value="{{ selected_line_granularity }}">
      <input type="hidden" name="top_kpi_adset" value="{{ selected_top_kpi_adset }}">

      <label class="filter-field top-kpi-field">
        <span class="filter-label">Top Platform KPI</span>
        <div class="top-kpi-control-row">
          <select name="top_kpi_platform" aria-label="Select KPI for top platform chart">
            {% for key, label in top_kpi_options.items() %}
            <option value="{{ key }}" {% if key == selected_top_kpi_platform %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
          <button type="submit" class="btn-apply">Apply Platform KPI</button>
        </div>
      </label>
    </form>
  </div>
</section>
