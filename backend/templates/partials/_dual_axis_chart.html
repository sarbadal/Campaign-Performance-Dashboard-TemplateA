<section id="dual-axis-trend" class="panel" aria-label="Dual-axis KPI trend">
  <div class="panel-header">Dual-axis KPI Trend</div>
  <form method="get" action="{{ url_for('dashboard.dashboard') }}#dual-axis-trend" class="dual-axis-form">
    <input type="hidden" name="date_from" value="{{ filters.date_from }}">
    <input type="hidden" name="date_to" value="{{ filters.date_to }}">
    {% for field in active_filter_fields %}
      {% for item in filters[field.key] %}
      <input type="hidden" name="{{ field.key }}" value="{{ item }}">
      {% endfor %}
    {% endfor %}
    <input type="hidden" name="top_kpi_adset" value="{{ selected_top_kpi_adset }}">
    <input type="hidden" name="top_kpi_platform" value="{{ selected_top_kpi_platform }}">
    <label class="filter-field">
      <span class="filter-label">Left Axis KPI</span>
      <select name="line_kpi_left" aria-label="Select left axis KPI">
        {% for key, label in top_kpi_options.items() %}
        <option value="{{ key }}" {% if key == selected_line_kpi_left %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="filter-field">
      <span class="filter-label">Right Axis KPI</span>
      <select name="line_kpi_right" aria-label="Select right axis KPI">
        {% for key, label in top_kpi_options.items() %}
        <option value="{{ key }}" {% if key == selected_line_kpi_right %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="filter-field">
      <span class="filter-label">X-axis Aggregation</span>
      <select name="line_granularity" aria-label="Select trend x-axis aggregation">
        {% for key, label in trend_granularity_options.items() %}
        <option value="{{ key }}" {% if key == selected_line_granularity %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit" class="btn-apply">Apply Trend KPIs</button>
  </form>

  {% if dual_axis_series.labels %}
  <div class="dual-axis-chart-wrap">
    <canvas
      id="dual-axis-kpi-chart"
      class="dual-axis-chart"
      role="img"
      aria-label="Dual-axis line chart for selected KPIs"
      data-labels='{{ dual_axis_series.labels | tojson }}'
      data-left-values='{{ dual_axis_series.left_values | tojson }}'
      data-right-values='{{ dual_axis_series.right_values | tojson }}'
      data-left-kpi-key="{{ selected_line_kpi_left }}"
      data-right-kpi-key="{{ selected_line_kpi_right }}"
      data-left-kpi-label="{{ top_kpi_options[selected_line_kpi_left] }}"
      data-right-kpi-label="{{ top_kpi_options[selected_line_kpi_right] }}"
      data-currency-symbol="{{ top_kpi_currency_symbol }}"
    ></canvas>
  </div>
  {% else %}
  <div class="empty-state">No date-wise KPI trend data available.</div>
  {% endif %}
</section>
