<section id="insights-top" class="insights-grid" aria-label="KPI insights">
  {% for chart in top_entity_charts %}
  <article class="panel" aria-label="Top {{ chart.label_plural }} by selected KPI">
    <div class="panel-header">Top {{ top_n_entities }} {{ chart.label_plural }} by {{ top_kpi_label }}</div>
    {% if chart.rows %}
    {% set row_count = chart.rows|length %}
    <div class="top-entity-chart-wrap">
      <canvas
        id="top-entity-chart-{{ chart.key }}"
        class="top-entity-chart"
        role="img"
        aria-label="Horizontal bar chart of top {{ chart.label_plural }} by selected KPI"
        data-row-count="{{ row_count }}"
        data-kpi-key="{{ selected_top_kpi }}"
        data-kpi-label="{{ top_kpi_label }}"
        data-currency-symbol="{{ top_kpi_currency_symbol }}"
        data-entity-colors='{{ chart.colors | tojson }}'
        data-default-color="{{ chart.default_color }}"
        data-labels='{{ chart.rows | map(attribute="entity") | list | tojson }}'
        data-values='{{ chart.rows | map(attribute="kpi_value") | list | tojson }}'
        data-display-values='{{ chart.rows | map(attribute="kpi_display") | list | tojson }}'
      ></canvas>
    </div>
    {% else %}
    <div class="empty-state">No {{ chart.label_plural|lower }} KPI data available.</div>
    {% endif %}
  </article>
  {% endfor %}
</section>
