<section class="top-banner" aria-label="Client banner">
  <div class="banner-inner">
    <div class="banner-copy">
      <div class="banner-kicker">{{ branding.dashboard_kicker }}</div>
      <div class="banner-title">{{ branding.banner_title }}</div>
      <div class="banner-subtitle">Prepared for {{ branding.client_name }}</div>
      <div class="banner-nav" aria-label="Page navigation">
        <a class="banner-nav-link {% if current_page == 'dashboard' %}is-active{% endif %}" href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
        <a class="banner-nav-link {% if current_page == 'deep_dive' %}is-active{% endif %}" href="{{ url_for('dashboard.deep_dive') }}">Deep Dive</a>
      </div>
    </div>
    <img
      class="banner-logo"
      src="{{ url_for('static', filename=branding.logo_image_path) }}"
      alt="{{ branding.client_name }} logo"
    >
  </div>
</section>
