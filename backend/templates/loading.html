<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ loading_title }}</title>
  <link rel="icon" type="image/x-icon" href="{{ static_url('img/favicon.ico', v='20260725a') }}">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #5f6b7a;
      --accent: #14532d;
      --ring: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, #eef6ff 0%, var(--bg) 50%, #eefbf2 100%);
      color: var(--text);
    }

    .loading-card {
      width: min(92vw, 560px);
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(17, 24, 39, 0.08);
      padding: 28px;
      text-align: center;
    }

    .loading-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .loading-subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.96rem;
    }

    .loader {
      margin: 22px auto 0;
      width: 28px;
      height: 28px;
      border: 3px solid #d1fae5;
      border-top-color: var(--ring);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .fallback {
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .fallback a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .fallback a:hover,
    .fallback a:focus-visible {
      text-decoration: underline;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main class="loading-card" aria-live="polite" aria-busy="true">
    <h1 class="loading-title">{{ loading_title }}</h1>
    <p class="loading-subtitle">{{ loading_subtitle }}</p>
    <div class="loader" role="presentation"></div>
    <p class="fallback">If you are not redirected automatically, <a href="{{ target_url }}">continue to dashboard</a>.</p>
  </main>

  <script>
    (function () {
      var target = {{ target_url|tojson }};
      window.requestAnimationFrame(function () {
        window.setTimeout(function () {
          window.location.replace(target);
        }, 120);
      });
    }());
  </script>
</body>
</html>
